server.port=8080
spring.application.name=valuo-api-gateway

# ===================================================================
# Actuator & Health Check
# ===================================================================
management.endpoints.web.exposure.include=health,info

# ===================================================================
# Rutas de Enrutamiento del API Gateway (Spring Cloud Gateway Server WebMVC)
# ===================================================================

# 1. Microservicio de Rentabilidad (8084)
spring.cloud.gateway.mvc.routes[0].id=rentabilidad-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/rentabilidad/**

# 2. Microservicio de Inmuebles (8082)
spring.cloud.gateway.mvc.routes[1].id=inmuebles-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/inmuebles/**

# 3. Microservicio de Predicciones (8083)
spring.cloud.gateway.mvc.routes[2].id=predicciones-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/predicciones/**,/api/v1/estimaciones/**,/api/v1/modelos/**

# 4. Microservicio de Usuarios y Autenticacion (8081)
spring.cloud.gateway.mvc.routes[3].id=usuarios-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios/**,/api/v1/distritos/**

# 5. Microservicio de Reportes PDF (8085)
spring.cloud.gateway.mvc.routes[4].id=reportes-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/v1/reportes/**

# 6. Microservicio de Monitoreo (8086)
spring.cloud.gateway.mvc.routes[5].id=monitoreo-service
spring.cloud.gateway.mvc.routes[5].uri=http://localhost:8086
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/v1/monitoreo/**